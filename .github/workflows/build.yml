name: Build MeeT
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zipdan yangilanishni ochish
        run: |
          for z in *.zip; do
            [ -f "$z" ] || continue
            mkdir _u && unzip -oq "$z" -d _u
            cp -r _u/*/. .
            rm -rf _u
          done
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create --platforms=android --project-name meet --org uz.meet .
      - name: Android permissions
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/><uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/><application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="meet"#android:label="MeeT"#' android/app/src/main/AndroidManifest.xml
      - name: Pub get va eski plaginlarni tuzatish
        run: |
          flutter pub get
          find "${PUB_CACHE:-$HOME/.pub-cache}" -path '*android/build.gradle*' -exec sed -Ei 's/(compileSdk(Version)?[ =]+)[0-9]+/\1 36/' {} +
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - name: Sign APK (doimiy kalit bilan)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          OUT=build/app/outputs/flutter-apk
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 secret yoq - APK debug kalit bilan imzolandi"
            cp $OUT/app-release.apk $OUT/MeeT.apk
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            $BT/apksigner sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS --key-pass env:KEY_PASS --ks-key-alias "$KEY_ALIAS" --out $OUT/MeeT.apk $OUT/app-release.apk
          fi
      - uses: actions/upload-artifact@v4
        with: { name: MeeT-apk, path: build/app/outputs/flutter-apk/MeeT.apk }
